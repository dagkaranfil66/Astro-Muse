workflows:
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    environment:
      node: 18.17.0
      java: 17
      android_signing:
        - tengri_keystore
      vars:
        PACKAGE_NAME: "co.median.android.bnljzke"
    scripts:
      - name: Install Node dependencies
        script: npm install --legacy-peer-deps

      - name: Fix node PATH for Gradle (react-native-reanimated)
        script: |
          NODE_PATH=$(which node)
          NODE_DIR=$(dirname $NODE_PATH)
          echo "Node binary: $NODE_PATH"
          echo "Node dir: $NODE_DIR"
          # Symlink node to /usr/local/bin so Gradle finds it
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node 2>/dev/null || true
          sudo ln -sf "$NODE_DIR/npm" /usr/local/bin/npm 2>/dev/null || true
          node --version

      - name: Build Android release AAB
        script: |
          export NODE_BINARY=$(which node)
          export PATH="$(dirname $(which node)):$PATH"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            --no-daemon \
            --max-workers=2 \
            -PnodeExecutable="$(which node)" \
            --info 2>&1 | tail -100

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - dagkaranfil@gmail.com
        notify:
          success: true
          failure: true
