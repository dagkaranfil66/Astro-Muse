workflows:
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    environment:
      node: 20.18.0
      java: 17
      android_signing:
        - tengri_keystore
      vars:
        PACKAGE_NAME: "co.median.android.bnljzke"
    scripts:
      - name: Install Node dependencies
        script: npm install --legacy-peer-deps

      - name: Build Android release AAB
        script: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
          cd android
          chmod +x ./gradlew
          # Save full build log to file so we can inspect Kotlin errors
          ./gradlew bundleRelease --no-daemon --max-workers=2 --info 2>&1 | tee /tmp/gradle_full.log; BUILD_EXIT=${PIPESTATUS[0]}
          # Extract just the Kotlin compile errors (e: prefix) and context
          grep -n "^e: \|rniap-patch\|compilePlayReleaseKotlin\|PromiseImpl\|error: " /tmp/gradle_full.log | head -60 || true
          # Copy artifact log
          cp /tmp/gradle_full.log ../gradle_build.log
          exit $BUILD_EXIT

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - gradle_build.log

    publishing:
      email:
        recipients:
          - dagkaranfil@gmail.com
        notify:
          success: true
          failure: true
